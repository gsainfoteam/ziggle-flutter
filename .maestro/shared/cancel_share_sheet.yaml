# Waits for the OS share sheet and closes it without sharing.
appId: me.gistory.ziggle
---
- runFlow:
    when:
      platform: Android
    commands:
      # IDs only the share sheet has (Android 15). Generic android:id/... IDs
      # such as android:id/content also exist on the app screen.
      - extendedWaitUntil:
          visible:
            id: "(android|com.android.intentresolver):id/(chooser_header|chooser_headline_row|resolver_list)"
          timeout: 10000
      - takeScreenshot: share_sheet_${SHARE_FROM}
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: ActivityListView
          timeout: 10000
      - takeScreenshot: share_sheet_${SHARE_FROM}
      # Some iOS versions show a Close button; newer ones close by swiping
      # the sheet down.
      - runFlow:
          when:
            visible: "Close|닫기"
          commands:
            - tapOn: "Close|닫기"
      - runFlow:
          when:
            visible:
              id: ActivityListView
          commands:
            - swipe:
                from:
                  id: ActivityListView
                direction: DOWN
      - extendedWaitUntil:
          notVisible:
            id: ActivityListView
          timeout: 10000
