name: build test (android, iOS)

on:
  pull_request:
    branches:
      - main
      - development
      - development-v4

jobs:
  flutter-test:
    name: Flutter unit and widget tests
    # Runs on every PR commit regardless of the changed paths, so PRs that only
    # touch test/** are checked too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: flutter-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: "stable"
          cache: true

      - name: Create test dotenv
        # pubspec.yaml bundles .env as an asset, so the file must exist. Tests
        # load the values they need with dotenv.loadFromString and must not
        # depend on repository variables or production service keys.
        run: echo "# empty .env for flutter test" > .env

      - name: Generate files
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build
          test -s lib/gen/assets.gen.dart
          test -s lib/gen/fonts.gen.dart

      - name: Run tests
        # The github reporter prints each failing test with its error and
        # stack trace and adds an annotation to the PR checks.
        run: flutter test --reporter github

  check-test-required:
    name: Check if test is required
    runs-on: ubuntu-latest
    outputs:
      android-changed: ${{ steps.android-changed-files.outputs.any_changed }}
      ios-changed: ${{ steps.ios-changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed Files (android)
        uses: tj-actions/changed-files@v37.5.0
        id: android-changed-files
        with:
          files: |
            pubspec.yaml
            pubspec.lock
            android/**
            lib/**

      - name: Changed Files (iOS)
        uses: tj-actions/changed-files@v37.5.0
        id: ios-changed-files
        with:
          files: |
            pubspec.yaml
            pubspec.lock
            ios/**
            lib/**

  build-and-test:
    name: Build ${{ matrix.os }} App and Test
    needs: check-test-required
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-26]
        include:
          - build-os: ubuntu-latest
            os: Android
          - build-os: macos-26
            os: iOS
    runs-on: ${{ matrix.build-os }}
    concurrency:
      group: ${{ matrix.os }}-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: setup env
        run: |
          echo "run=${{
              matrix.os == 'Android' && needs.check-test-required.outputs.android-changed == 'true' ||
              matrix.os == 'iOS' && needs.check-test-required.outputs.ios-changed == 'true'
            }}" >> $GITHUB_ENV
          echo "directory=$(echo ${{ matrix.os }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        if: env.run == 'true'
      - uses: subosito/flutter-action@v2
        if: env.run == 'true'
        with:
          flutter-version: "3.50.0"
          channel: "stable"
          cache: true
      - name: install flutterfire
        if: env.run == 'true'
        run: flutter pub global activate flutterfire_cli
      - uses: actions/setup-java@v4
        if: env.run == 'true' && matrix.os == 'Android'
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - uses: ruby/setup-ruby@v1
        if: env.run == 'true'
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ${{ env.directory }}

      - name: Copy dotenv
        if: env.run == 'true'
        run: |
          echo '${{ vars.DOTENV }}' > .env
          echo "AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}" >> .env
          echo "SMARTLOOK_API_KEY=${{ secrets.SMARTLOOK_API_KEY }}" >> .env

      - name: Generate files
        if: env.run == 'true'
        run: |
          dart run slang
          dart run build_runner build
          test -s lib/gen/assets.gen.dart
          test -s lib/gen/fonts.gen.dart
      - name: Run fastlane
        if: env.run == 'true'
        run: bundle exec fastlane test
        env:
          # PR builds are not distributed, and upload-symbols can hang the archive.
          SKIP_CRASHLYTICS_SYMBOL_UPLOAD: "1"
        working-directory: ${{ env.directory }}
