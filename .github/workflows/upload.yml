name: build and publish (android, iOS)

on:
  push:
    branches:
      - development

jobs:
  e2e:
    name: E2E before upload
    # Off until the repository variable E2E_GATE is "true", so the deploy is
    # not blocked before the test account and device runs are stable.
    if: vars.E2E_GATE == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}
      platform: both
      suite: core
    secrets:
      E2E_IDP_EMAIL: ${{ secrets.E2E_IDP_EMAIL }}
      E2E_IDP_PASSWORD: ${{ secrets.E2E_IDP_PASSWORD }}

  build-and-upload:
    needs: e2e
    # Upload only when the core flows passed on both platforms, or when the
    # gate is off and the e2e job was skipped.
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-26]
        include:
          - os: Android
            build-os: ubuntu-latest
          - os: iOS
            build-os: macos-26
    name: Build ${{ matrix.os }} App and Upload
    runs-on: ${{ matrix.build-os }}
    # A normal run takes about 10 minutes on either platform. Without a limit,
    # a hung step holds the runner until the 6-hour default.
    timeout-minutes: 45
    concurrency:
      group: ${{ matrix.os }}-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: setup env
        run: |
          echo "directory=$(echo ${{ matrix.os }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: shimataro/ssh-key-action@v2.7.0
        if: matrix.os == 'iOS'
        with:
          key: ${{ secrets.CERTIFICATION_DEPLOY_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Write Keystore
        if: matrix.os == 'Android'
        run: |
          echo ${{ secrets.KEYSTORE }} | base64 --decode > ./android/app/upload-keystore.jks
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > ./android/key.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
      - uses: actions/setup-node@v4
        if: matrix.os == 'Android'
      - uses: w9jds/setup-firebase@main
        if: matrix.os == 'Android'
        with:
          tools-version: 12.4.5
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      - uses: actions/setup-java@v4
        if: matrix.os == 'Android'
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ${{ env.directory }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"
          cache: true
      - name: install flutterfire
        run: flutter pub global activate flutterfire_cli

      - name: Copy dotenv
        run: |
          echo '${{ vars.DOTENV }}' > .env
          echo "AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}" >> .env
          echo "SMARTLOOK_API_KEY=${{ secrets.SMARTLOOK_API_KEY }}" >> .env

      - name: Generate files
        run: |
          dart run slang
          dart run build_runner build
          test -s lib/gen/assets.gen.dart
          test -s lib/gen/fonts.gen.dart
      - name: Run fastlane
        run: bundle exec fastlane internal
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
          # upload-symbols can hang inside the Xcode archive, so the archive
          # skips it and the next step uploads the dSYMs with a time limit.
          SKIP_CRASHLYTICS_SYMBOL_UPLOAD: "1"
        working-directory: ${{ env.directory }}

      - name: Upload Crashlytics dSYMs
        # Also run when fastlane failed after the build (for example in the
        # Slack notification), since the archive no longer uploads symbols.
        if: ${{ !cancelled() && matrix.os == 'iOS' }}
        # A failed or slow symbol upload must not fail the release.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          DSYMS=build/ios/archive/Runner.xcarchive/dSYMs
          if [ ! -d "$DSYMS" ]; then
            echo "::warning::$DSYMS not found; skipping Crashlytics symbol upload"
            exit 0
          fi
          UPLOAD_SYMBOLS=build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols
          if [ ! -x "$UPLOAD_SYMBOLS" ]; then
            UPLOAD_SYMBOLS=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols' -type f -perm -u+x 2>/dev/null | head -n 1)
          fi
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "::warning::Crashlytics upload-symbols not found; skipping symbol upload"
            exit 0
          fi
          # With --split-debug-info, the Dart symbols for iOS are in
          # App.framework.dSYM. Upload it too if the archive does not have it.
          if [ ! -d "$DSYMS/App.framework.dSYM" ]; then
            APP_DSYM=$(find build/ios "$HOME/Library/Developer/Xcode/DerivedData" -type d -name App.framework.dSYM -path '*Release-iphoneos*' 2>/dev/null | head -n 1)
            if [ -n "$APP_DSYM" ]; then
              cp -R "$APP_DSYM" "$DSYMS/"
            else
              echo "::warning::App.framework.dSYM not found; Dart stack traces will stay obfuscated"
            fi
          fi
          "$UPLOAD_SYMBOLS" -gsp ios/Runner/GoogleService-Info.plist -p ios "$DSYMS"

      - name: action-slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() || cancelled() }}
        with:
          status: ${{ job.status }}
          author_name: Github Action Build
          mention: ${{ secrets.SLACK_MENTION }}
          if_mention: "failure,cancelled"
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
