name: ziggle
description: ziggle
publish_to: "none"
version: 4.4.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  adaptive_platform_ui: 0.1.111
  gist_chatbot_flutter: 0.1.1
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1
  firebase_messaging: ^16.0.1
  get_it: ^8.0.2
  injectable: ^2.5.1
  slang: ^4.1.0
  slang_flutter: ^4.1.0
  flutter_svg: ^2.0.10+1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_quill: ^11.4.1
  keyboard_actions: ^4.2.0
  dotted_border: ^3.1.0
  intl: ^0.20.0
  sheet: ^1.0.0
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  flutter_web_auth_2: ^4.0.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  dio_cookie_manager: ^3.1.1
  retrofit: ^4.7.2
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  rxdart: ^0.28.0
  flutter_bloc: ^9.1.1
  collection: ^1.18.0
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  extended_text: ^15.0.2
  mutex: ^3.1.0
  auto_route: ^10.1.2
  flutter_local_notifications: ^19.4.2
  vsc_quill_delta_to_html: ^1.0.5
  dynamic_fonts: ^2.2.1
  flutter_quill_delta_from_html: ^1.4.1
  share_plus: ^12.0.0
  cached_network_image: ^3.4.1
  amplitude_flutter: ^4.3.1
  flutter_dotenv: ^6.0.0
  lottie: ^3.1.3
  app_links: ^6.3.3
  nonce: ^1.2.0
  crypto: ^3.0.6
  hive_ce: ^2.13.2
  hive_ce_flutter: ^2.3.2
  bloc_concurrency: ^0.3.0

# gist_chatbot_flutter 0.1.1 only uses PackageInfo.fromPlatform().packageName,
# which is available in 9.x. Keep the current native plugins for this UI change.
# Remove after the SDK accepts 9.x or the app's plugins migrate together.
dependency_overrides:
  package_info_plus: 9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.8.1
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.7.0
  retrofit_generator: ^10.0.5
  json_serializable: ^6.8.0
  freezed: ^3.2.3
  auto_route_generator: ^10.2.4
  gsheets: ^0.5.0
  dotenv: ^4.2.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  hive_ce_generator: ^1.9.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/fire.svg
    - assets/logo/short.svg
    - assets/logo/long.svg
    - assets/logo/transparent.png
    - assets/logo/infoteam.svg
    - assets/icons/
    - assets/images/
    - assets/fonts/TossFace/LICENSE
    - assets/lotties/
  fonts:
    - family: TossFace
      fonts:
        - asset: assets/fonts/TossFace/TossFaceFontWeb.otf

flutter_gen:
  integrations:
    flutter_svg: true
