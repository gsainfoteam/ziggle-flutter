name: ziggle
description: ziggle
publish_to: "none"
version: 4.5.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  adaptive_platform_ui: ^1.0.2
  gist_chatbot_flutter: ^0.1.2
  # 2026-11 릴리스부터 Android 플러그인이 AGP built-in Kotlin을 요구한다.
  # adaptive_platform_ui, flutter_web_auth_2가 아직 KGP를 쓰므로 직전 릴리스로 고정한다.
  firebase_core: 5.1.0
  firebase_crashlytics: 6.0.1
  firebase_analytics: 13.0.1
  firebase_messaging: 17.0.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  slang: ^4.1.0
  slang_flutter: ^4.1.0
  flutter_svg: ^2.0.10+1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_quill: ^11.4.1
  keyboard_actions: ^5.0.3
  dotted_border: ^3.1.0
  intl: ^0.20.0
  sheet: ^1.0.0
  flutter_secure_storage: ^10.3.4
  dio: ^5.7.0
  flutter_web_auth_2: ^5.1.0
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  dio_cookie_manager: ^3.1.1
  retrofit: ^4.7.2
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  rxdart: ^0.28.0
  flutter_bloc: ^9.1.1
  collection: ^1.18.0
  flutter_inappwebview: ^6.2.0-beta.3
  url_launcher: ^6.3.0
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  extended_text: ^15.0.2
  mutex: ^3.1.0
  auto_route: ^11.2.0
  flutter_local_notifications: ^23.0.2
  vsc_quill_delta_to_html: ^1.0.5
  dynamic_fonts: ^3.1.0
  flutter_quill_delta_from_html: ^1.4.1
  share_plus: ^13.3.1
  cached_network_image: ^4.0.7
  amplitude_flutter: ^4.3.1
  flutter_dotenv: ^6.0.0
  lottie: ^3.1.3
  app_links: ^7.2.2
  nonce: ^1.2.0
  crypto: ^3.0.6
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.2
  bloc_concurrency: ^0.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.7.0
  retrofit_generator: ^10.0.5
  json_serializable: ^6.15.2
  freezed: ^3.2.3
  auto_route_generator: ^10.6.0
  gsheets: ^0.5.0
  dotenv: ^4.2.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  hive_ce_generator: ^1.9.2
  plugin_platform_interface: ^2.1.8
  flutter_web_auth_2_platform_interface: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/fire.svg
    - assets/logo/short.svg
    - assets/logo/long.svg
    - assets/logo/transparent.png
    - assets/logo/infoteam.svg
    - assets/icons/
    - assets/images/
    - assets/fonts/TossFace/LICENSE
    - assets/lotties/
  fonts:
    - family: TossFace
      fonts:
        - asset: assets/fonts/TossFace/TossFaceFontWeb.otf

flutter_gen:
  integrations:
    flutter_svg: true
